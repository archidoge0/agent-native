name: "ghav before: CI"
"on":
  push:
    branches:
      - ghav/dev/6646
    paths:
      - .ghav/before
permissions:
  contents: read
jobs:
  change-scope:
    name: Determine change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: "true"
      lint: ${{ steps.scope.outputs.lint }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      workspace_filters: ${{ steps.scope.outputs.workspace_filters }}
      test_workspace_filters: ${{ steps.scope.outputs.test_workspace_filters }}
      fast_tests: ${{ steps.scope.outputs.fast_tests }}
      content: ${{ steps.scope.outputs.content }}
      core_integration: ${{ steps.scope.outputs.core_integration }}
      plan_e2e: ${{ steps.scope.outputs.plan_e2e }}
      brain_evals: ${{ steps.scope.outputs.brain_evals }}
      build: ${{ steps.scope.outputs.build }}
      trusted_acceptance: ${{ steps.scope.outputs.trusted_acceptance }}
      scaffold: ${{ steps.scope.outputs.scaffold }}
      ssr_boot: ${{ steps.scope.outputs.ssr_boot }}
      ssr_boot_apps: ${{ steps.scope.outputs.ssr_boot_apps }}
      guards: ${{ steps.scope.outputs.guards }}
      qa_static: ${{ steps.scope.outputs.qa_static }}
      neon_query_budget: ${{ steps.scope.outputs.neon_query_budget }}
      query_budget_matrix: ${{ steps.scope.outputs.query_budget_matrix }}
      neon_connection_budget: ${{ steps.scope.outputs.neon_connection_budget }}
      design_canvas_interaction_e2e: ${{ steps.scope.outputs.design_canvas_interaction_e2e }}
      agentkit_acceptance: ${{ steps.scope.outputs.agentkit_acceptance }}
      slides_chat_e2e: ${{ steps.scope.outputs.slides_chat_e2e }}
      slides_authoring_e2e: ${{ steps.scope.outputs.slides_authoring_e2e }}
      changeset: ${{ steps.scope.outputs.changeset }}
      script_tests: ${{ steps.scope.outputs.script_tests }}
      lanes_matrix: ${{ contains(github.workflow_ref, '/ghav-human.yml@') && '{"include":[{"lane":"lane-1","filters":"--filter mail --filter calendar --filter @agent-native/desktop-app --filter @agent-native/creative-context --filter @agent-native/agent-browser-extension --filter @agent-native/pinpoint","packages":["mail","calendar","@agent-native/desktop-app","@agent-native/creative-context","@agent-native/agent-browser-extension","@agent-native/pinpoint"],"packageShards":[],"files":600,"coreShard":"5/8","coreMode":"full"},{"lane":"lane-2","filters":"--filter clips --filter forms --filter dispatch --filter @agent-native/agent-chrome-extension --filter @agent-native/otel","packages":["clips","forms","dispatch","@agent-native/agent-chrome-extension","@agent-native/otel"],"packageShards":[],"files":598,"coreShard":"8/8","coreMode":"full"},{"lane":"lane-3","filters":"--filter analytics --filter plan --filter assets --filter @agent-native/mobile-app --filter @agent-native/browser-control-extension-core --filter agent-native","packages":["analytics","plan","assets","@agent-native/mobile-app","@agent-native/browser-control-extension-core","agent-native"],"packageShards":[],"files":598,"coreShard":"4/8","coreMode":"full"},{"lane":"lane-4","filters":"--filter content --filter @agent-native/docs --filter brain --filter clips-chrome-extension --filter @agent-native/migrate","packages":["content","@agent-native/docs","brain","clips-chrome-extension","@agent-native/migrate"],"packageShards":[],"files":598,"coreShard":"1/8","coreMode":"full"},{"lane":"lane-5","filters":"--filter tasks","packages":["tasks"],"packageShards":[{"name":"design","shard":"2/2"}],"files":598,"coreShard":"7/8","coreMode":"full"},{"lane":"lane-6","filters":"--filter slides --filter @agent-native/dispatch --filter clips-desktop --filter chat --filter @agent-native/recap-cli","packages":["slides","@agent-native/dispatch","clips-desktop","chat","@agent-native/recap-cli"],"packageShards":[],"files":597,"coreShard":"3/8","coreMode":"full"},{"lane":"lane-7","filters":"--filter @agent-native/agentkit --filter @agent-native/scheduling --filter @agent-native/skills --filter @agent-native/code-agents-ui","packages":["@agent-native/agentkit","@agent-native/scheduling","@agent-native/skills","@agent-native/code-agents-ui"],"packageShards":[{"name":"design","shard":"1/2"}],"files":597,"coreShard":"6/8","coreMode":"full"},{"lane":"lane-8","filters":"--filter @agent-native/toolkit --filter factory --filter crm --filter @agent-native/embedding","packages":["@agent-native/toolkit","factory","crm","@agent-native/embedding"],"packageShards":[],"files":597,"coreShard":"2/8","coreMode":"full"}]}' || '{"include":[{"lane":"lane-1","filters":"--filter clips --filter content --filter @agent-native/toolkit --filter analytics --filter calendar --filter @agent-native/dispatch --filter factory --filter assets --filter clips-desktop --filter brain --filter @agent-native/mobile-app --filter @agent-native/agentkit --filter @agent-native/agent-browser-extension --filter chat --filter @agent-native/skills --filter @agent-native/browser-control-extension-core --filter @agent-native/embedding --filter @agent-native/recap-cli --filter @agent-native/agent-chrome-extension --filter @agent-native/otel","packages":["clips","content","@agent-native/toolkit","analytics","calendar","@agent-native/dispatch","factory","assets","clips-desktop","brain","@agent-native/mobile-app","@agent-native/agentkit","@agent-native/agent-browser-extension","chat","@agent-native/skills","@agent-native/browser-control-extension-core","@agent-native/embedding","@agent-native/recap-cli","@agent-native/agent-chrome-extension","@agent-native/otel"],"files":2392,"coreShard":"1/2","coreMode":"full"},{"lane":"lane-2","filters":"--filter design --filter slides --filter mail --filter plan --filter @agent-native/desktop-app --filter @agent-native/docs --filter @agent-native/creative-context --filter crm --filter forms --filter tasks --filter @agent-native/scheduling --filter clips-chrome-extension --filter dispatch --filter @agent-native/pinpoint --filter @agent-native/migrate --filter @agent-native/code-agents-ui --filter agent-native","packages":["design","slides","mail","plan","@agent-native/desktop-app","@agent-native/docs","@agent-native/creative-context","crm","forms","tasks","@agent-native/scheduling","clips-chrome-extension","dispatch","@agent-native/pinpoint","@agent-native/migrate","@agent-native/code-agents-ui","agent-native"],"files":2391,"coreShard":"2/2","coreMode":"full"}]}' }}
      has_tests: "true"
      core_test_files: "[]"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test change scope classifier
        run: node --experimental-strip-types --test scripts/ci-change-scope.test.ts scripts/ci-build-workspaces.test.ts
      - name: Test fast-test lane planner
        run: node --experimental-strip-types --test scripts/ci-test-lanes.test.ts
      - name: Install dependencies for targeted lane planning
        if: steps.scope.outputs.full != 'true' && steps.scope.outputs.fast_tests == 'true'
        uses: ./.github/actions/setup-pnpm
        with:
          install: no-scripts
      - name: Partition test packages into sharded lanes
        id: lanes
        if: steps.scope.outputs.full == 'true' || steps.scope.outputs.fast_tests == 'true'
        env:
          CI_FULL: ${{ steps.scope.outputs.full }}
          TARGETED_WORKSPACE_FILTERS: ${{ steps.scope.outputs.test_workspace_filters }}
          LANES: 2
        run: |
          set -euo pipefail
          if [ "$CI_FULL" = "true" ]; then
            node --experimental-strip-types scripts/ci-test-lanes.ts
          else
            base_sha="$(git rev-parse HEAD^1)"
            CI_WORKSPACE_FILTERS="$TARGETED_WORKSPACE_FILTERS" CI_BASE_SHA="$base_sha" \
              node --experimental-strip-types scripts/ci-test-lanes.ts
          fi
  test-rest:
    name: Fast tests ${{ matrix.lane }}
    needs: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITEST_CONCURRENCY: 100%
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.change-scope.outputs.lanes_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium for browser-backed unit tests
        run: |
          pnpm exec playwright install --only-shell --force chromium
          pnpm --filter @agent-native/creative-context exec playwright install --only-shell --force chromium
      - name: Run core fast-test shard
        if: matrix.coreShard != ''
        run: pnpm --filter @agent-native/core exec vitest run --dir src --shard=${{ matrix.coreShard }} --exclude "**/*.db.test.ts" --exclude "**/*.integration.spec.ts" --exclude "**/*.integration.test.ts" --exclude "**/*.e2e.spec.ts" --exclude "**/*.e2e.test.ts" --exclude "**/e2e/**" --exclude "**/*.live.spec.ts" --exclude "**/*.live.test.ts" --exclude "**/*.perf.spec.ts" --exclude "**/*.perf.test.ts" --exclude "**/create-e2e.spec.ts"
      - name: Run package fast tests for lane
        if: matrix.filters != ''
        run: pnpm -r --no-bail --workspace-concurrency=1 ${{ matrix.filters }} run test --exclude "**/*.db.test.ts" --exclude "**/*.integration.spec.ts" --exclude "**/*.integration.test.ts" --exclude "**/*.e2e.spec.ts" --exclude "**/*.e2e.test.ts" --exclude "**/e2e/**" --exclude "**/*.live.spec.ts" --exclude "**/*.live.test.ts" --exclude "**/*.perf.spec.ts" --exclude "**/*.perf.test.ts" --exclude "**/create-e2e.spec.ts"
