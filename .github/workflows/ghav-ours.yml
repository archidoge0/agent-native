name: "ghav ours: CI"
"on":
  push:
    branches:
      - ghav/dev/6446
permissions:
  contents: read
jobs:
  change-scope:
    name: Determine change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
      lint: ${{ steps.scope.outputs.lint }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      workspace_filters: ${{ steps.scope.outputs.workspace_filters }}
      test_workspace_filters: ${{ steps.scope.outputs.test_workspace_filters }}
      fast_tests: ${{ steps.scope.outputs.fast_tests }}
      content: ${{ steps.scope.outputs.content }}
      core_integration: ${{ steps.scope.outputs.core_integration }}
      plan_e2e: ${{ steps.scope.outputs.plan_e2e }}
      brain_evals: ${{ steps.scope.outputs.brain_evals }}
      build: ${{ steps.scope.outputs.build }}
      trusted_acceptance: ${{ steps.scope.outputs.trusted_acceptance }}
      scaffold: ${{ steps.scope.outputs.scaffold }}
      ssr_boot: ${{ steps.scope.outputs.ssr_boot }}
      ssr_boot_apps: ${{ steps.scope.outputs.ssr_boot_apps }}
      guards: ${{ steps.scope.outputs.guards }}
      qa_static: ${{ steps.scope.outputs.qa_static }}
      neon_query_budget: "true"
      query_budget_apps: "[\"analytics\",\"assets\",\"brain\",\"calendar\",\"chat\",\"clips\",\"content\",\"crm\",\"design\",\"dispatch\",\"factory\",\"forms\",\"mail\",\"plan\",\"slides\",\"tasks\"]"
      neon_connection_budget: ${{ steps.scope.outputs.neon_connection_budget }}
      agentkit_acceptance: ${{ steps.scope.outputs.agentkit_acceptance }}
      changeset: ${{ steps.scope.outputs.changeset }}
      script_tests: ${{ steps.scope.outputs.script_tests }}
      lanes_matrix: ${{ steps.lanes.outputs.matrix }}
      has_tests: ${{ steps.lanes.outputs.has_tests }}
      core_test_files: ${{ steps.lanes.outputs.core_test_files }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test change scope classifier
        run: node --experimental-strip-types --test scripts/ci-change-scope.test.ts scripts/ci-build-workspaces.test.ts
      - name: Test fast-test lane planner
        run: node --experimental-strip-types --test scripts/ci-test-lanes.test.ts
      - name: Install dependencies for targeted lane planning
        if: steps.scope.outputs.full != 'true' && steps.scope.outputs.fast_tests == 'true'
        uses: ./.github/actions/setup-pnpm
        with:
          install: no-scripts
      - name: Partition test packages into sharded lanes
        id: lanes
        if: steps.scope.outputs.full == 'true' || steps.scope.outputs.fast_tests == 'true'
        env:
          CI_FULL: ${{ steps.scope.outputs.full }}
          TARGETED_WORKSPACE_FILTERS: ${{ steps.scope.outputs.test_workspace_filters }}
          LANES: 2
        run: |
          set -euo pipefail
          if [ "$CI_FULL" = "true" ]; then
            node --experimental-strip-types scripts/ci-test-lanes.ts
          else
            base_sha="$(git rev-parse HEAD^1)"
            CI_WORKSPACE_FILTERS="$TARGETED_WORKSPACE_FILTERS" CI_BASE_SHA="$base_sha" \
              node --experimental-strip-types scripts/ci-test-lanes.ts
          fi
  neon-query-budget:
    name: Cold-request query budget
    needs:
      - change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENT_NATIVE_RELEASE_MIGRATIONS: "1"
      AUTH_DISABLED: "true"
      BETTER_AUTH_SECRET: neon-query-budget-test-secret
      DATABASE_URL: pglite:memory
      NETLIFY: "true"
      NODE_ENV: production
      RUN_BACKGROUND_JOBS: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"
      - name: Build and measure the affected first-party templates
        env:
          QUERY_BUDGET_APPS: "[\"analytics\",\"brain\",\"chat\",\"content\",\"design\",\"factory\",\"mail\",\"slides\"]"
        run: |
          set -euo pipefail
          mapfile -t apps < <(jq -r '.[]' <<< "$QUERY_BUDGET_APPS")
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::change-scope selected the query budget but no templates to measure."
            exit 1
          fi
          echo "Measuring: ${apps[*]}"
          for app in "${apps[@]}"; do
            app_dir="templates/$app"
            rm -rf "$app_dir/.netlify" "$app_dir/.output" "$app_dir/.vercel" "$app_dir/dist" "$app_dir/build"
            release_migrations=""
            if [[ -f "$app_dir/netlify.toml" ]]; then
              release_migrations="$(python3 -c 'import pathlib, sys, tomllib; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text()).get("context", {}).get("production", {}).get("environment", {}).get("AGENT_NATIVE_RELEASE_MIGRATIONS", ""))' "$app_dir/netlify.toml")"
            fi
            if [[ "$release_migrations" == "1" ]]; then
              export AGENT_NATIVE_RELEASE_MIGRATIONS=1
            else
              unset AGENT_NATIVE_RELEASE_MIGRATIONS
            fi
            NITRO_PRESET=netlify pnpm --filter "$app" build
            pnpm ops:neon-query-budget --app "$app" --mode check
            rm -rf "$app_dir/.netlify" "$app_dir/.output" "$app_dir/.vercel" "$app_dir/dist" "$app_dir/build"
          done
  neon-query-budget-ghav1:
    name: Cold-request query budget (ghav 1)
    needs:
      - change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENT_NATIVE_RELEASE_MIGRATIONS: "1"
      AUTH_DISABLED: "true"
      BETTER_AUTH_SECRET: neon-query-budget-test-secret
      DATABASE_URL: pglite:memory
      NETLIFY: "true"
      NODE_ENV: production
      RUN_BACKGROUND_JOBS: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"
      - name: Build and measure the affected first-party templates
        env:
          QUERY_BUDGET_APPS: "[\"assets\",\"calendar\",\"clips\",\"crm\",\"dispatch\",\"forms\",\"plan\",\"tasks\"]"
        run: |
          set -euo pipefail
          mapfile -t apps < <(jq -r '.[]' <<< "$QUERY_BUDGET_APPS")
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::change-scope selected the query budget but no templates to measure."
            exit 1
          fi
          echo "Measuring: ${apps[*]}"
          for app in "${apps[@]}"; do
            app_dir="templates/$app"
            rm -rf "$app_dir/.netlify" "$app_dir/.output" "$app_dir/.vercel" "$app_dir/dist" "$app_dir/build"
            release_migrations=""
            if [[ -f "$app_dir/netlify.toml" ]]; then
              release_migrations="$(python3 -c 'import pathlib, sys, tomllib; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text()).get("context", {}).get("production", {}).get("environment", {}).get("AGENT_NATIVE_RELEASE_MIGRATIONS", ""))' "$app_dir/netlify.toml")"
            fi
            if [[ "$release_migrations" == "1" ]]; then
              export AGENT_NATIVE_RELEASE_MIGRATIONS=1
            else
              unset AGENT_NATIVE_RELEASE_MIGRATIONS
            fi
            NITRO_PRESET=netlify pnpm --filter "$app" build
            pnpm ops:neon-query-budget --app "$app" --mode check
            rm -rf "$app_dir/.netlify" "$app_dir/.output" "$app_dir/.vercel" "$app_dir/dist" "$app_dir/build"
          done
