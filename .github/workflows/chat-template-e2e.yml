name: Chat template E2E
'on':
  workflow_dispatch: {}
concurrency:
  group: chat-template-e2e-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  standalone-chat:
    name: Standalone Chat acceptance (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AGENT_NATIVE_CREATE_USE_LOCAL_CORE: '1'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: ./.github/actions/standalone-chat-acceptance
